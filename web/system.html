<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElektroDump - System</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main>
  <div class="grid">
    <div class="card">
      <h2>Host</h2>
      <dl class="kv">
        <dt>CPU</dt><dd id="sys-cpu">-</dd>
        <dt>memory</dt><dd id="sys-mem">-</dd>
        <dt>temperature</dt><dd id="sys-temp">-</dd>
        <dt>disk free</dt><dd id="sys-disk">-</dd>
        <dt>load (1m)</dt><dd id="sys-load">-</dd>
        <dt>uptime</dt><dd id="sys-uptime">-</dd>
      </dl>
    </div>
    <div class="card">
      <h2>SDR</h2>
      <dl class="kv">
        <dt>driver</dt><dd id="sys-sdr-driver">-</dd>
        <dt>frequency</dt><dd id="sys-sdr-freq">-</dd>
        <dt>sample rate</dt><dd id="sys-sdr-rate">-</dd>
        <dt>gain</dt><dd id="sys-sdr-gain">-</dd>
        <dt>overflows</dt><dd id="sys-sdr-overflows">-</dd>
      </dl>
    </div>
    <div class="card">
      <h2>Pipeline</h2>
      <dl class="kv">
        <dt>mode</dt><dd id="sys-mode">-</dd>
        <dt>state</dt><dd id="sys-state">-</dd>
        <dt>locked</dt><dd id="sys-locked">-</dd>
        <dt>SNR</dt><dd id="sys-snr">-</dd>
        <dt>BER</dt><dd id="sys-ber">-</dd>
        <dt>CADU total</dt><dd id="sys-cadu-total">-</dd>
        <dt>CADU bad</dt><dd id="sys-cadu-bad">-</dd>
        <dt>files</dt><dd id="sys-files">-</dd>
      </dl>
    </div>
    <div class="card">
      <h2>Webhook</h2>
      <p class="muted">Fire a test event to every configured endpoint.</p>
      <div class="row">
        <button id="webhook-test">POST /api/v1/webhook/test</button>
        <span class="muted" id="webhook-result"></span>
      </div>
    </div>
  </div>
  <div class="card">
    <h2>Raw status</h2>
    <pre id="sys-raw">loading…</pre>
  </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
'use strict';
(function () {
  function setText(id, value) {
    const node = document.getElementById(id);
    if (node) { node.textContent = value; }
  }

  async function tick() {
    try {
      const health = await ED.getJson('/api/v1/health');
      setText('sys-cpu', ED.fmt(health.cpu_percent, 1) + ' %');
      setText('sys-mem', health.memory_used_mb + ' / ' +
        health.memory_total_mb + ' MB');
      setText('sys-temp', ED.fmt(health.temperature_c, 1) + ' °C');
      setText('sys-disk', health.disk_free_mb + ' / ' +
        health.disk_total_mb + ' MB');
      setText('sys-load', ED.fmt(health.load_1m, 2));
      setText('sys-uptime', ED.fmtDuration(health.uptime_seconds));
    } catch (error) { /* keep previous */ }

    try {
      const status = await ED.getJson('/api/v1/status');
      const sdr = status.sdr || {};
      const pipeline = status.pipeline || {};
      setText('sys-sdr-driver', sdr.available ? sdr.driver : 'unavailable');
      setText('sys-sdr-freq', sdr.available
        ? ED.fmt(sdr.center_freq_hz / 1e6, 3) + ' MHz' : '-');
      setText('sys-sdr-rate', sdr.available
        ? ED.fmt(sdr.sample_rate_hz / 1e6, 2) + ' MSPS' : '-');
      // The backend maps gain_tenth_db/100, clamped per stage, so /100 is the
      // gain actually applied. /10 printed "150.0 dB" for a 15 dB setting.
      setText('sys-sdr-gain', sdr.available
        ? ED.fmt(sdr.gain_tenth_db / 100, 1) + ' dB' : '-');
      setText('sys-sdr-overflows', String(sdr.overflows || 0));
      setText('sys-mode', status.mode || '-');
      setText('sys-state', pipeline.state || '-');
      setText('sys-locked', pipeline.locked ? 'yes' : 'no');
      setText('sys-snr', ED.fmt(pipeline.snr_db, 2) + ' dB');
      setText('sys-ber', ED.fmt(pipeline.ber, 6));
      setText('sys-cadu-total', String(pipeline.cadus_total || 0));
      setText('sys-cadu-bad', String(pipeline.cadus_bad || 0));
      setText('sys-files', String(pipeline.files_total || 0));
      document.getElementById('sys-raw').textContent =
        JSON.stringify(status, null, 2);
    } catch (error) { /* keep previous */ }
  }

  document.getElementById('webhook-test').addEventListener('click', async function () {
    const result = await ED.postJson('/api/v1/webhook/test');
    document.getElementById('webhook-result').textContent =
      'HTTP ' + result.status + ' ' + JSON.stringify(result.data);
  });

  ED.setPage('system');
  ED.startStatusPolling();

  // Public host: no write controls, and no raw dump (it carries paths and a
  // device serial a stranger has no business reading).
  ED.getJson('/api/v1/status').then(function (data) {
    if (!data || !data.public) { return; }
    for (const id of ['webhook-test', 'webhook-result']) {
      const node = document.getElementById(id);
      if (node) { node.style.display = 'none'; }
    }
    const raw = document.getElementById('sys-raw');
    if (raw && raw.closest('.card')) {
      raw.closest('.card').style.display = 'none';
    }
  }).catch(function () { /* leave the page as-is */ });
  ED.repeatWhileVisible(tick, 1000);
})();
</script>
</body>
</html>
