<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElektroDump - Station</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main>
  <section class="card">
    <h2>Link - Elektro-L received level</h2>
    <div class="linkbar">
      <div class="big" id="dash-snr">-</div>
      <div class="stats">
        <div class="stat"><b id="dash-avg">-</b><i>avg 5 s</i></div>
        <div class="stat"><b id="dash-lock">-</b><i>sync</i></div>
        <div class="stat"><b id="dash-ber">-</b><i>ber</i></div>
        <div class="stat"><b id="dash-cadus">-</b><i>cadu</i></div>
        <div class="stat"><b id="dash-mode">-</b><i>mode</i></div>
        <div class="stat"><b id="dash-next">-</b><i>next window</i></div>
      </div>
    </div>
    <canvas id="spark" width="900" height="88" style="margin-top:20px"></canvas>
  </section>

  <div class="grid two">
    <section class="card">
      <h2>Latest product</h2>
      <img id="latest-image" alt="Latest visual product" style="display:none">
      <div class="emptybox" id="latest-empty">waiting for the first decoded xRIT pass</div>
      <div class="muted" id="latest-caption" style="font-family:var(--mono);font-size:12px"></div>
    </section>

    <section class="card">
      <h2>Station</h2>
      <dl class="kv">
        <dt>radio</dt><dd id="dash-sdr">-</dd>
        <dt>satellite</dt><dd id="dash-satellite">-</dd>
        <dt>pipeline</dt><dd id="dash-state">-</dd>
        <dt>build</dt><dd id="dash-version">-</dd>
      </dl>
    </section>
  </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
