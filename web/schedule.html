<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElektroDump - Schedule</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main>
  <div class="card">
    <h2>Schedule</h2>
    <div class="toolbar">
      <label><input type="checkbox" id="sched-enabled"> enabled</label>
      <label>timezone <input id="sched-timezone" value="UTC" size="8"></label>
      <label>default mode
        <select id="sched-mode">
          <option value="ggak">ggak</option>
          <option value="lrit">lrit</option>
          <option value="hrit">hrit</option>
        </select>
      </label>
      <button id="sched-add">add entry</button>
      <button id="sched-save" class="primary">Save</button>
      <button id="sched-reload">Reload</button>
      <span class="muted" id="sched-result"></span>
    </div>
    <span class="muted" id="sched-state"></span>
    <table>
      <thead>
        <tr><th>name</th><th>start</th><th>end</th><th>mode</th><th>priority</th><th>frequency (Hz)</th><th></th></tr>
      </thead>
      <tbody id="sched-rows"></tbody>
    </table>
  </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/schedule.js"></script>
</body>
</html>
