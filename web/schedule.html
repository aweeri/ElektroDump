<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElektroDump - Passes</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar" id="topbar"></header>
<main>
  <section class="card">
    <h2>Pass timetable - 24 h, UTC</h2>
    <figure class="timeline">
      <svg id="tl-svg" viewBox="0 0 1000 150" role="img"
           aria-labelledby="tl-title tl-desc">
        <title id="tl-title">Elektro-L pass timetable</title>
        <desc id="tl-desc">HRIT and LRIT reception windows across a 24 hour day.</desc>
      </svg>
    </figure>
    <dl class="tl-list" id="tl-list"></dl>
    <p class="figcap" id="tl-cap">Loading the timetable…</p>
  </section>

  <section class="card">
    <h2>Windows</h2>
    <table>
      <thead>
        <tr><th>window</th><th>start</th><th>end</th><th class="num">minutes</th><th>mode</th></tr>
      </thead>
      <tbody id="sched-rows"></tbody>
    </table>
    <p class="figcap" id="sched-state">reading the schedule…</p>
  </section>
</main>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/schedule.js"></script>
</body>
</html>
